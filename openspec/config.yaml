schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Stack Augmentor: augments Java stack trace frames with receiver members (members of the object a frame's
  method runs on) and parameter values (selected arguments), so logged exceptions say what the failing code
  was working on. Three ways to run: Java agent, agent live-stack mode (experimental, with a native JVMTI
  library), and build-time instrumentation (ByteBuddy Gradle plugin, only api + runtime needed at runtime).
  Tech stack: Java for the published modules (no Kotlin runtime dependency), Kotlin for examples and
  tests, Java 25, Gradle 9 (Kotlin DSL, version catalog), ByteBuddy, tomlj, JUnit 6, C for the native library.
  Modules: api, instrument-bridge, runtime, instrument, agent, native, build-plugin; not published: under it/,
  agent (agent and live-stack integration tests), build-time, spring-boot, quarkus, benchmark; examples/java-agent,
  examples/live-agent, examples/build-time.
  Configuration: TOML files with [augment] only (formats, maxValueLength) with the tables [augment.exceptions], [augment.annotations], [augment.receiver] and
  [augment.params]; first matching entry decides in every table. Annotations: @Augmented,
  @AugmentedReceiver, @AugmentedParam, @AugmentedParams. Options of the whole JVM are system properties:
  stackaugmentor.config, stackaugmentor.debug, stackaugmentor.inPlaceModification; the agent takes no arguments.
  Wording: frames and exceptions are "augmented"; say "receiver members" and "parameter values", never "ids".
  Specs: start with specs/functional/overview (goal, terminology, which spec owns which rule); functional
  capabilities under specs/functional/, non-functional requirements under specs/non-functional/.

