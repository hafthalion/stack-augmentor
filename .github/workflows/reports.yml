name: Reports

# Publishes the test and frame reports of each CI run on master to GitHub Pages: the frame reports under
# frames/, each module's test report under tests/<module>/, and an index page that links them. It takes the
# test-reports archive that CI uploaded, so nothing is built again, and it never runs for pull requests.
# Needs Pages enabled in the repository settings, with "GitHub Actions" as the source. GitHub runs it from
# master's copy of this file.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: reports
  cancel-in-progress: true

jobs:
  publish:
    # Also after a failed build, whose reports show what failed; not for a cancelled one, or a pull request
    # from a fork's master branch.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the reports of the CI run
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Collect the reports
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          mkdir -p site/tests
          links=""
          if [ -d reports/stack-augmentor-it/build/reports/frames ]; then
            cp -r reports/stack-augmentor-it/build/reports/frames site/frames
            links="<li><a href=\"frames/index.html\">Frame reports</a> (agent integration tests)</li>"
          fi
          for report in $(cd reports && find . -path '*/build/reports/tests/test/index.html' | sort); do
            module=$(echo "$report" | sed -e 's|^\./||' -e 's|/build/reports/tests/test/index.html$||')
            mkdir -p "site/tests/$module"
            cp -r "reports/$(dirname "$report")/." "site/tests/$module/"
            links="$links<li><a href=\"tests/$module/index.html\">$module</a> (tests)</li>"
          done
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>stack-augmentor reports</title>
          <style>body{font:15px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}</style></head>
          <body><h1>stack-augmentor reports</h1>
          <p>Build of master at <code>${SHA::7}</code>: $CONCLUSION, <a href="$RUN_URL">run $RUN_NUMBER</a>, published $(date -u '+%Y-%m-%d %H:%M UTC').</p>
          <ul>$links</ul></body></html>
          HTML

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
