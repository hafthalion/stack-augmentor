name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows too: file locking and path forms (backslashes, drive letters) differ there, and only show up on it.
    # Its native library is built with the runner's MinGW gcc.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Gradle itself must run on Java 25: the build-time example and stack-augmentor-it/build-time load the
      # build plugin, compiled for 25, into the Gradle JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Compiles all modules, runs the unit tests, the agent integration tests and the build-time integration tests.
      - run: ./gradlew build

      # On every run, also when the build fails: the run's summary page links the archive. The frame reports
      # (stack-augmentor-it/agent/build/reports/frames, start with index.html) show the frames each agent test caught;
      # frames-live the same for the agent's live-stack mode.
      # On master, reports.yml publishes this archive to GitHub Pages.
      - name: Upload test and frame reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # reports.yml takes the Linux one.
          name: test-reports${{ matrix.os != 'ubuntu-latest' && format('-{0}', matrix.os) || '' }}
          path: |
            **/build/reports/tests/
            **/build/reports/frames/
            **/build/reports/frames-live/
          retention-days: 7

