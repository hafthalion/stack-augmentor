# The *_EXCLUDED scenarios throw ExcludedException, which is not augmented although its frames are configured.
[augment.exceptions]
"com.hafnium.it.benchmark.ExcludedException" = false
"com.hafnium.it.benchmark.BenchmarkException+" = true

# The benchmark's frames: Configured shows its name and its depth parameter, from its annotations (it has @Augmented);
# Plain shows nothing.
