<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
:root{--bg:#f4f6f8;--surface:#ffffff;--code:#f0f3f7;--ink:#1b2230;--muted:#5b6678;--line:#d9dee6;--accent:#1f5f8b;--mark:#fbe7b0;--markink:#5a3d00;--ok:#1e7a4c;--okbg:#e2f3ea;--bad:#b3261e;--badbg:#fbe4e2;--kw:#8a3b8f;--cm:#6b7686;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--surface:#1a2029;--code:#141a22;--ink:#e3e8ef;--muted:#98a3b3;--line:#2c3542;--accent:#7fb3dd;--mark:#4a3a12;--markink:#f7dc8f;--ok:#7fd3a4;--okbg:#173427;--bad:#f2a49e;--badbg:#3d1d1b;--kw:#d59bd8;--cm:#8591a2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--surface:#1a2029;--code:#141a22;--ink:#e3e8ef;--muted:#98a3b3;--line:#2c3542;--accent:#7fb3dd;--mark:#4a3a12;--markink:#f7dc8f;--ok:#7fd3a4;--okbg:#173427;--bad:#f2a49e;--badbg:#3d1d1b;--kw:#d59bd8;--cm:#8591a2;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:28px}
h1{font-size:28px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline}
p{margin:0;max-width:68ch}
a{color:var(--accent)}
code,pre{font-family:ui-monospace,monospace;font-size:13px}
.meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.toc{columns:2 260px;margin:0;padding-left:20px}
.toc span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.cat{display:grid;gap:12px}
.cat h2{padding-bottom:4px;border-bottom:1px solid var(--line)}
mark{background:var(--mark);color:var(--markink);border-radius:3px;padding:0 2px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;display:grid;gap:10px}
.case header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.num{font-family:monospace;font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;min-width:2ch}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;text-transform:uppercase;letter-spacing:.05em;flex:none}
.pill.passed{background:var(--okbg);color:var(--ok)}
.pill.failed,.pill.missing{background:var(--badbg);color:var(--bad)}
pre{margin:0;overflow-x:auto;white-space:pre;background:var(--code);border-radius:4px;padding:10px 12px;line-height:1.5}
.call{color:var(--accent);font-weight:500}
.kt .c{color:var(--cm)}
.kt .k{color:var(--kw)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frames{margin:0;padding-left:22px;display:grid;gap:2px}
.frames li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px}
.frames li::marker{color:var(--muted);font-family:monospace;font-size:12px}
.frames code{overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--muted)}
.aug .tag{color:var(--markink)}
.plain code{color:var(--muted)}
.frames li.cause{margin-top:6px;list-style:none}
.cause code{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<div>
<h1>{title}</h1>
<p style="margin-top:8px">{intro}</p>
<div class="meta">{meta}</div>
</div>
<div class="box"><h2>{count}</h2><ol class="toc">{toc}</ol></div>
{sections}
</div>
</body>
</html>
