[augment]
maxIdLength = 20
# Above the default (4), so the six-parameter fixtures show all their parameters
maxParams = 8

# The two tables are independent: [augment.receiver] for the receiver ids, [augment.params] for the parameter ids.
[augment.receiver]
# The fixtures' receiver ids come from their @StackTraceId
"com.hafnium.it.fixtures.**" = "@"
# ... except Overridden, whose exact entry is more specific
"com.hafnium.it.fixtures.Overridden" = "getId()"
# ... and except the ignored ones: no receiver id, the more specific "-" pattern wins (parameter ids are not affected)
"com.hafnium.it.fixtures.ignored.**" = "-"
# Stand-ins for classes you cannot annotate
"com.thirdparty.Order" = "getOrderNumber()"
"com.thirdparty.Customer" = "customerId"
"com.thirdparty.*Account" = "number"
# Matches JDK classes, which the agent never instruments
"java.**" = "@"
# Entries do not apply to subclasses (InheritanceTest): a frame uses the entry of the class declaring its method
"com.hafnium.it.inheritance.Order" = "id"
"com.hafnium.it.inheritance.ExpressOrder" = "id"
"com.hafnium.it.inheritance.TrackedOrder" = "tracking"
"com.hafnium.it.inheritance.Priority" = "code"
"com.hafnium.it.inheritance.GiftOrder" = "note"
"com.hafnium.it.inheritance.DiscontinuedOrder" = "-"
"com.hafnium.it.inheritance.Invoice" = "number"
"com.hafnium.it.inheritance.Shipment" = "id"
"com.hafnium.it.inheritance.Labeled" = "label()"
"com.hafnium.it.inheritance.Parcel" = "code"
"com.hafnium.it.inheritance.Tracked" = "label()"
"com.hafnium.it.inheritance.JavaLabeled" = "label()"
"com.hafnium.it.inheritance.JavaParcel" = "code"
"com.hafnium.it.inheritance.ParcelRepository" = "name"
"com.hafnium.it.inheritance.Repository" = "name"
# ... while a pattern matches every class whose name fits, generated subclasses in the package included
"com.hafnium.it.inheritance.patterned.*" = "code"
# Pattern precedence: the more specific pattern wins, and an entry without wildcards wins over any pattern
"com.hafnium.it.inheritance.ranked.**" = "code"
"com.hafnium.it.inheritance.ranked.excluded.*" = "-"
"com.hafnium.it.inheritance.ranked.excluded.Kept" = "code"
"com.hafnium.it.inheritance.ranked.special.*" = "tag"

[augment.params]
# The fixtures' parameter ids come from their @StackTraceParam and @StackTraceParams
"com.hafnium.it.fixtures.**.*" = "@"
# ... except Overridden's, except for failAnnotated, whose exact entry is more specific
"com.hafnium.it.fixtures.Overridden.*" = "-"
"com.hafnium.it.fixtures.Overridden.failAnnotated" = "@"
"com.thirdparty.OrderService.process" = ["order", 1]
# Wildcards: combined with the entry above, and across packages
"com.thirdparty.OrderService.*" = [2]
"com.thirdparty.Inventory*.*" = "*"
# ... except for InventoryAudit, whose more specific "-" entry wins, except for log, whose exact entry wins
"com.thirdparty.InventoryAudit.*" = "-"
"com.thirdparty.InventoryAudit.log" = ["reason"]
"com.thirdparty.**.*Repository.find*" = [0]
# Matches JDK classes, which the agent never instruments
"java.**.*" = "*"
"com.hafnium.it.fixtures.Overlap.op" = ["x", "y"]
"com.hafnium.it.inheritance.OrderService.process" = "*"
# Parameter annotations outside the fixtures
"com.hafnium.it.outside.MethodAnnotationsOutside.run" = "@"
"com.hafnium.it.outside.ClassParamsViaMethods.*" = "@"
