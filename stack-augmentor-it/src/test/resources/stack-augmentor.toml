[augment]
maxIdLength = 20

# All throwables get ids (without an entry that is true, none would).
[augment.exceptions]
"**" = true

# The two tables are independent: [augment.receiver] for the receiver ids, [augment.params] for the parameter ids.
# Their keys are "<class>::<methods>": a class name matches that class only, "+" after it its subclasses too, a
# pattern matches class names; "*" after '::' stands for all methods.
[augment.receiver]
# The first matching entry wins, so the more specific entries come first.
# Overridden's exact entry, before the fixtures' pattern
"com.hafnium.it.fixtures.Overridden::*" = "getId()"
# The ignored fixtures: no receiver id (parameter ids are not affected)
"com.hafnium.it.fixtures.ignored.**::*" = "-"
# The fixtures' receiver ids come from their @StackTraceId
"com.hafnium.it.fixtures.**::*" = "@"
# Stand-ins for classes you cannot annotate (Customer's entry does not apply to com.hafnium.it.outside.VipCustomer)
"com.thirdparty.Order::*" = "getOrderNumber()"
"com.thirdparty.Customer::*" = "customerId"
# Several receiver ids, in this order
"com.thirdparty.OrderLine::*" = "tenant, lineId()"
"com.thirdparty.*Account::*" = "number"
# '?' matches one character: Ledger1, not Ledger12
"com.thirdparty.Ledger?::*" = "code"
# After '::' the methods whose frames the entry applies to, names or patterns.
# A class may have several entries: for each method the first one that applies decides
"com.thirdparty.Parcel::ship, cancel*" = "trackingCode"
"com.thirdparty.Parcel::weigh" = "weight"
# "@" after '::' names the methods annotated with @StackTraceAugment
"com.hafnium.it.outside.Dispatcher::@" = "hub"
# Matches JDK classes, which the agent never instruments
"java.**::*" = "@"
# "+" after a class name matches its subclasses too (InheritanceTest): a frame uses the first entry that matches
# the class declaring its method, so subclasses with entries of their own come before their superclasses
"com.hafnium.it.inheritance.ExpressOrder+::*" = "id"
"com.hafnium.it.inheritance.TrackedOrder+::*" = "tracking"
"com.hafnium.it.inheritance.GiftOrder+::*" = "note"
"com.hafnium.it.inheritance.DiscontinuedOrder+::*" = "-"
"com.hafnium.it.inheritance.Order+::*" = "id"
"com.hafnium.it.inheritance.Priority+::*" = "code"
"com.hafnium.it.inheritance.Invoice+::*" = "number"
"com.hafnium.it.inheritance.Shipment+::*" = "id"
"com.hafnium.it.inheritance.Parcel+::*" = "code"
"com.hafnium.it.inheritance.JavaParcel+::*" = "code"
# An interface's name with "+" matches the classes implementing it too
"com.hafnium.it.inheritance.Tracked+::*" = "label()"
"com.hafnium.it.inheritance.Labeled+::*" = "label()"
"com.hafnium.it.inheritance.Coded+::*" = "trackingCode"
"com.hafnium.it.inheritance.JavaLabeled+::*" = "label()"
"com.hafnium.it.inheritance.ParcelRepository+::*" = "name"
"com.hafnium.it.inheritance.Repository+::*" = "name"
# ... while a pattern matches the classes whose names fit only, generated subclasses in the package included
"com.hafnium.it.inheritance.patterned.*::*" = "code"
# Order: the first matching entry wins, however specific a later one is
"com.hafnium.it.inheritance.ranked.excluded.Kept::*" = "code"
"com.hafnium.it.inheritance.ranked.excluded.*::*" = "-"
"com.hafnium.it.inheritance.ranked.special.*::*" = "tag"
"com.hafnium.it.inheritance.ranked.**::*" = "code"
# ... so this entry never applies: Account is matched by "ranked.**" above
"com.hafnium.it.inheritance.ranked.Account::*" = "-"

[augment.params]
# The first matching entry wins, so the more specific entries come first.
# Overridden's failAnnotated uses its annotations, its other methods none ...
"com.hafnium.it.fixtures.Overridden::failAnnotated" = "@"
"com.hafnium.it.fixtures.Overridden::*" = "-"
"com.hafnium.it.fixtures.Overlap::op" = "x, y, 0"
# ... and the other fixtures' parameter ids come from their @StackTraceParam and @StackTraceParams
# ("*" matches constructors, <init>, too)
"com.hafnium.it.fixtures.**::*" = "@"
"com.thirdparty.OrderService::process" = "order, 1"
# Wildcards: not combined with the entry above, which comes first, and across packages
"com.thirdparty.OrderService::*" = "2"
# InventoryAudit's log, then its other methods ("-"), then the other Inventory* classes
"com.thirdparty.InventoryAudit::log" = "reason"
"com.thirdparty.InventoryAudit::*" = "-"
"com.thirdparty.Inventory*::*" = "sku, count"
"com.thirdparty.**.*Repository::find*" = "0"
# Hashed values: "#" after a name or an index (annotations use secret = true, see Secrets)
"com.thirdparty.UserService::invite" = "user, email#, 2#"
# "+" after a class name: its subclasses too, here com.hafnium.it.outside.PremiumAccount
"com.thirdparty.SavingsAccount+::transfer" = "amount"
# Matches JDK classes, which the agent never instruments
"java.**::*" = "0"
"com.hafnium.it.inheritance.OrderService::process" = "order"
# Parameter annotations outside the fixtures
"com.hafnium.it.outside.MethodAnnotationsOutside::run" = "@"
"com.hafnium.it.outside.ClassParamsViaMethods::*" = "@"
# "::@" matches the methods annotated with @StackTraceAugment; several methods are separated by commas
"com.hafnium.it.outside.Dispatcher::@, track" = "order"
