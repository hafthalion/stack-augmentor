# The application's context configuration: the build reads its method and annotation tables, and at runtime it applies to
# all classes that Spring Boot's class loader loads, the application's and its libraries', after the agent's configuration if there
# is one.

[augment]
receiverFormat = "<$value>"

[augment.exceptions]
"java.lang.Exception+" = true

[augment.annotations]
"com.hafnium.it.spring.**" = true

# A library class: only the agent instruments it, build-time instrumentation changes the application's classes only.
[augment.params]
"org.springframework.util.Assert::notNull" = "1"
