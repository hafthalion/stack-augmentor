# The module's global file, for both phases:
# - [augment.annotations], [augment.receiver] and [augment.params] are read at build time by the ByteBuddy build
#   plugin (see build.gradle.kts), which instruments the classes and methods they need;
# - [augment], [augment.exceptions], [augment.annotations], [augment.receiver], debug and inPlaceModification are read
#   at runtime, from the classpath (or from -Dstackaugmentor.config=<file>).

# Print diagnostics to stderr (default: false).
debug = false

# How frames look, at runtime (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$value, ...}"
paramsFormat = "{$name=$value, ...}"
# Longer values are cut off with "…".
maxValueLength = 64

# Which exceptions are augmented, at runtime: all throwables (without an entry that is true, none would).
[augment.exceptions]
"**" = true

# Where the annotations are read: the project's classes. The classes in com.hafnium.it.buildtime.configured have no
# annotations: the entries below augment them.
[augment.annotations]
"com.hafnium.it.buildtime.**" = true

# Only this project's classes are changed.
# Keys are "<class>::<methods>": a class name matches that class only, "+" after it ("com.acme.Order+::*") its
# subclasses too, and a pattern matches class names. The methods are names or patterns separated by commas, "*" for
# all. '*' matches within a package or name, '**' across packages, '?' one character. A method that no entry matches
# uses its class's annotations, where [augment.annotations] selects the class.

# The receiver members of the classes you cannot annotate are in the module's local stack-augmentor.toml.

# Parameter values, independently of the receivers, selected by name or 0-based index, separated by commas; "#"
# after one shows its value hashed, and "-" selects none. When several entries match a method, the first one
# applies, so the more specific entries come first. An entry wins over the method's annotations.
[augment.params]
"com.hafnium.it.buildtime.ClassWithoutAnnotation::method" = "q"
"com.hafnium.it.buildtime.configured.OrderService::process" = "order, 1"       # by name and by index
"com.hafnium.it.buildtime.configured.InventoryAudit::*" = "-"                    # InventoryAudit's first: no parameter values ...
"com.hafnium.it.buildtime.configured.Inventory*::*" = "sku, count"           # ... then all methods of the other Inventory* classes
"com.hafnium.it.buildtime.configured.Customer::notify" = "email#"              # hashed
"com.hafnium.it.buildtime.configured.Shipment::<init>" = "orderId, weight"   # constructors: "<init>"
"com.hafnium.it.buildtime.configured.Crate::<init>" = "orderId, weight"
