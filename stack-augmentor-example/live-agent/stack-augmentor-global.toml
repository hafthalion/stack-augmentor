# The JVM's configuration, named by -Dstackaugmentor.config (see build.gradle.kts). -Dstackaugmentor.debug=true prints
# diagnostics to stderr: the configuration, which classes and methods get instrumented and why, where each receiver
# member and parameter value comes from, and config entries or annotations that have no effect.

# Only the example's exceptions are augmented: in the live-stack mode the agent looks at the stack of every throwable
# whose trace the VM records, also those the JDK creates and catches itself, unless no entry augments it. A class
# name matches that class only ("+" after it would add its subclasses); the first matching entry wins.
[augment.exceptions]
"com.hafnium.examples.live.PaymentDeclinedException" = true
"com.hafnium.examples.live.SlowCallWarning" = true
"java.lang.IllegalArgumentException" = true              # the receipt's require(...)

# Every class of the example has @Augmented and is augmented by its annotations, so every frame of its stack traces
# can be augmented; the formats are the defaults. The configuration is the same whether or not the agent reads the frames
# from the live stack (see stack-augmentor-example/java-agent for all the options).
