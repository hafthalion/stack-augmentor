# Every class of the example takes its ids from its annotations, so every frame of its stack traces can show
# them; the formats are the defaults. The configuration is the same whether or not the agent reads the frames
# from the live stack (see examples/java-agent for all the options).
[augment.receiver]
"com.hafnium.examples.live.**" = "@"

[augment.params]
"com.hafnium.examples.live.**.*" = "@"
