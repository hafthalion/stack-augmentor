# Read at runtime from the classpath (or from -Dstackaugmentor.config=<file>).
# With build-time instrumentation only the layout and debug matter: what gets instrumented
# was decided at build time (all classes of this project that use @StackTraceId).

# Longer ids are cut off with "…" (default: 64).
maxIdLength = 64

# Where ids go, see the README (these are the defaults).
frameFormat = "{class}{receiver}.{method}{params}"
receiverFormat = "{$name=$id}"
paramsFormat = "{$name=$id, ...}"

# Print diagnostics to stderr (default: false).
debug = false
