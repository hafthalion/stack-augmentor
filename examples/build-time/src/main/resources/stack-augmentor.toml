# One file for both phases:
# - [augment.annotations], [augment.receiver] and [augment.params] are read at build time by the ByteBuddy build
#   plugin (see build.gradle.kts), which instruments the classes and methods they need;
# - [augment], [augment.exceptions], [augment.annotations], [augment.receiver], debug and inPlaceModification are read
#   at runtime, from the classpath (or from -Dstackaugmentor.config=<file>).

# Print diagnostics to stderr (default: false).
debug = false
inPlaceModification = false

# How frames look, at runtime (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$value, ...}"
paramsFormat = "{$name=$value, ...}"
# Longer values are cut off with "…".
maxValueLength = 64

# Which exceptions are augmented, at runtime: true or false, the first matching entry wins, and an exception that
# no entry matches is not (so without entries, none is). A class name matches that class only, "+" after it also
# its subclasses, as instanceof does; a pattern matches the exception's own class only.
[augment.exceptions]
"java.lang.IllegalArgumentException+" = false            # this class and its subclasses: not augmented
"java.lang.*" = true                                     # these classes only, e.g. Exception, IllegalStateException

# Where the annotations are read: @AugmentedReceiver, @AugmentedParam, @AugmentedParams and @Augmented. Keys and
# values as in [augment.exceptions]; a class that no entry matches does not read them. Only the methods that
# @Augmented selects, on the class or on the method, use them: a class without @Augmented is ignored.
[augment.annotations]
"com.hafnium.examples.buildtime.**" = true

# Only this project's classes are changed: entries for real library classes don't apply. The com.thirdparty
# classes here are stand-ins compiled with this project, so their entries do.
# Keys are "<class>::<methods>": a class name matches that class only, "+" after it ("com.acme.Order+::*") its
# subclasses too, and a pattern matches class names. The methods are names or patterns separated by commas, "*" for
# all. '*' matches within a package or name, '**' across packages, '?' one character. A method that no entry matches
# uses its class's annotations, where [augment.annotations] selects the class.

# Receiver members of classes you cannot annotate: a method() or a field. An order is identified by its
# getOrderNumber() method, a customer by its customerId field.
[augment.receiver]
"com.thirdparty.Order::*" = "getOrderNumber()"
"com.thirdparty.Customer::*" = "customerId"

# Parameter values, independently of the receivers, selected by name or 0-based index, separated by commas; "#"
# after one shows its value hashed, and "-" selects none. When several entries match a method, the first one
# applies, so the more specific entries come first. An entry wins over the method's annotations.
[augment.params]
"com.hafnium.examples.buildtime.ClassWithoutAnnotation::method" = "q"
"com.thirdparty.OrderService::process" = "order, 1"                     # by name and by index
"com.thirdparty.InventoryAudit::*" = "-"                                  # InventoryAudit's first: no parameter values ...
"com.thirdparty.Inventory*::*" = "sku, count"                         # ... then all methods of the other Inventory* classes
"com.thirdparty.Customer::notify" = "email#"                            # hashed
