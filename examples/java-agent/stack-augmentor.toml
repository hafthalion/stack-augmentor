# Print diagnostics to stderr (default: false): the configuration, which classes and methods get
# instrumented and why, where each id comes from, and config entries or annotations that have no effect.
debug = false
inPlaceModification = true

# How frames look (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$id, ...}"
paramsFormat = "{$name=$id, ...}"
# Longer ids are cut off with "…".
maxIdLength = 64

# The two tables below are independent: [augment.receiver] decides which receivers get ids,
# [augment.params] which parameters. The agent instruments whatever classes and methods they need.
# In keys, '*' matches within a package or name, '**' across packages, '?' one character.

# Receiver ids: "@" uses the class's @StackTraceId (without an "@" entry, it is not used). Classes you
# cannot annotate name a method() or a field: an order is identified by its getOrderNumber() method, a
# customer by its customerId field.
[augment.receiver]
"com.hafnium.examples.agent.**" = "@"
"com.thirdparty.Order" = "getOrderNumber()"
"com.thirdparty.Customer" = "customerId"

# Parameter ids: "@" uses the methods' @StackTraceParam and @StackTraceParams annotations. Otherwise
# parameters are selected by name or 0-based index, "#" after one shows its value hashed, and "-" selects
# none. When several entries match a method, only the most specific one applies: an exact
# "<class>.<method>" beats any pattern, and a longer pattern a shorter one.
[augment.params]
"com.hafnium.examples.agent.**.*" = "@"
"com.hafnium.examples.agent.ClassWithoutAnnotation.method" = ["q"]   # exact: beats the "@" pattern
"com.thirdparty.OrderService.process" = ["order", 1]                 # by name and by index
"com.thirdparty.Inventory*.*" = ["sku", "count"]                     # all methods of the Inventory* classes ...
"com.thirdparty.InventoryAudit.*" = "-"                              # ... except InventoryAudit's
"com.thirdparty.Customer.notify" = ["email#"]                        # hashed
