# Print diagnostics to stderr (default: false): the configuration, which classes and methods get
# instrumented and why, where each id comes from, and config entries or annotations that have no effect.
debug = false

# What gets instrumented; the agent reads this when classes are loaded. In keys, '*' matches within a
# package or name, '**' across packages, '?' one character.

# Receiver ids: "@" uses the classes' @StackTraceId, @StackTraceParam and @StackTraceParams annotations
# (without an "@" entry, no annotations are used). Classes you cannot annotate name a field or a method():
# an order is identified by its getOrderNumber() method, a customer by its customerId field.
[instrument.classes]
"com.hafnium.**" = "@"
"com.thirdparty.Order" = "getOrderNumber()"
"com.thirdparty.Customer" = "customerId"

# Parameter ids: OrderService.process shows its order argument and its second parameter (quantity), and all
# methods of the Inventory* classes and of ClassWithoutAnnotation show all their parameters ("*").
[instrument.methods]
"com.thirdparty.OrderService.process" = ["order", 1]
"com.thirdparty.Inventory*.*" = "*"
"com.hafnium.ClassWithoutAnnotation.*" = "*"

# How frames look; used at runtime (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$id}"
paramsFormat = "{$name=$id, ...}"
# Longer ids are cut off with "…".
maxIdLength = 64
# At most this many parameter ids per frame; more are shown as "…".
maxParams = 4
