# For the whole JVM: only in this file, the agent's, never in one on the classpath.
[settings]
# Print diagnostics to stderr (default: false): the configuration, which classes and methods get
# instrumented and why, where each receiver member and parameter value comes from, and config entries or annotations that have no effect.
debug = false
# Write augmented frames into the exception's own stack trace (default: true); the agent makes that possible.
# inPlaceModification = true

# How frames look (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$value, ...}"
paramsFormat = "{$name=$value, ...}"
# Longer values are cut off with "…".
maxValueLength = 64

# Which exceptions are augmented: true or false, the first matching entry wins, and an exception that no entry
# matches is not (so without entries, none is). A class name matches that class only, "+" after it also its
# subclasses, as instanceof does; a pattern matches the exception's own class only.
[augment.exceptions]
"com.hafnium.examples.agent.CheckoutException+" = true   # this class and its subclasses
"java.lang.IllegalArgumentException+" = false            # this class and its subclasses: not augmented
"java.lang.*" = true                                     # these classes only, e.g. Exception, IllegalStateException

# Where the annotations are read: @AugmentedReceiver, @AugmentedParam, @AugmentedParams and @Augmented. Keys and
# values as in [augment.exceptions]; a class that no entry matches does not read them. Only the methods that
# @Augmented selects, on the class or on the method, use them: a class without @Augmented is ignored.
[augment.annotations]
"com.hafnium.examples.agent.**" = true

# The two tables below name members and parameters, independently: [augment.receiver] decides which receivers
# are augmented, [augment.params] which parameters. The agent instruments whatever classes and methods they and the
# annotations need.
# Keys are "<class>::<methods>": a class name matches that class only, "+" after it ("com.acme.Order+::*") its
# subclasses too, and a pattern matches class names. The methods are names or patterns separated by commas, "*" for
# all. '*' matches within a package or name, '**' across packages, '?' one character. A method that no entry matches
# uses its class's annotations, where [augment.annotations] selects the class.

# Receiver members of classes you cannot annotate: a method() or a field. An order is identified by its
# getOrderNumber() method, a customer by its customerId field.
[augment.receiver]
"com.thirdparty.Order::*" = "getOrderNumber()"
"com.thirdparty.Customer::*" = "customerId"

# Parameter values, selected by name or 0-based index, separated by commas; "#" after one shows its value hashed,
# and "-" selects none. When several entries match a method, the first one applies, so the more specific entries
# come first. An entry wins over the method's annotations.
[augment.params]
"com.hafnium.examples.agent.ClassWithoutAnnotation::method" = "q"
"com.thirdparty.OrderService::process" = "order, 1"                 # by name and by index
"com.thirdparty.InventoryAudit::*" = "-"                              # InventoryAudit's first: no parameter values ...
"com.thirdparty.Inventory*::*" = "sku, count"                     # ... then all methods of the other Inventory* classes
"com.thirdparty.Customer::notify" = "email#"                        # hashed
