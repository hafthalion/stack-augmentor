# Print diagnostics to stderr (default: false): the configuration, which classes and methods get
# instrumented and why, where each id comes from, and config entries or annotations that have no effect.
debug = false
inPlaceModification = true

# How frames look (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$id, ...}"
paramsFormat = "{$name=$id, ...}"
# Longer ids are cut off with "…".
maxIdLength = 64

# Which exceptions get ids: true or false, the first matching entry wins, and an exception that no entry matches
# gets none (so without entries, none does). A class name matches that class only, "+" after it also its
# subclasses, as instanceof does; a pattern matches the exception's own class only.
[augment.exceptions]
"com.hafnium.examples.agent.CheckoutException+" = true   # this class and its subclasses
"java.lang.IllegalArgumentException+" = false            # this class and its subclasses: no ids
"java.lang.*" = true                                     # these classes only, e.g. Exception, IllegalStateException

# The two tables below are independent: [augment.receiver] decides which receivers get ids,
# [augment.params] which parameters. The agent instruments whatever classes and methods they need.
# Keys are "<class>::<methods>": a class name matches that class only, "+" after it ("com.acme.Order+::*") its
# subclasses too, and a pattern matches class names. The methods are names or patterns separated by commas, "*" for
# all, "@" for those annotated with @StackTraceAugment. '*' matches within a package or name, '**' across packages,
# '?' one character.

# Receiver ids: "@" uses the class's @StackTraceId (without an "@" entry, it is not used). Classes you
# cannot annotate name a method() or a field: an order is identified by its getOrderNumber() method, a
# customer by its customerId field.
[augment.receiver]
"com.hafnium.examples.agent.**::*" = "@"
"com.thirdparty.Order::*" = "getOrderNumber()"
"com.thirdparty.Customer::*" = "customerId"

# Parameter ids: "@" uses the methods' @StackTraceParam and @StackTraceParams annotations. Otherwise
# parameters are selected by name or 0-based index, separated by commas, "#" after one shows its value hashed, and "-" selects
# none. When several entries match a method, the first one applies, so the more specific
# entries come first.
[augment.params]
"com.hafnium.examples.agent.ClassWithoutAnnotation::method" = "q"   # before the "@" pattern
"com.hafnium.examples.agent.**::*" = "@"
"com.thirdparty.OrderService::process" = "order, 1"                 # by name and by index
"com.thirdparty.InventoryAudit::*" = "-"                              # InventoryAudit's first: no parameter ids ...
"com.thirdparty.Inventory*::*" = "sku, count"                     # ... then all methods of the other Inventory* classes
"com.thirdparty.Customer::notify" = "email#"                        # hashed
