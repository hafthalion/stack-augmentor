# Print diagnostics to stderr (default: false): the configuration, which classes and methods get
# instrumented and why, where each id comes from, and config entries or annotations that have no effect.
debug = false

# How frames look (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$id}"
paramsFormat = "{$name=$id, ...}"
# Longer ids are cut off with "…".
maxIdLength = 64

# The two tables below are independent: [augment.receiver] decides which receivers get ids,
# [augment.params] which parameters. The agent instruments whatever classes and methods they need.
# In keys, '*' matches within a package or name, '**' across packages, '?' one character.

# Receiver ids: "@" uses the class's @StackTraceId (without an "@" entry, it is not used). Classes you
# cannot annotate name a field or a method(): an order is identified by its getOrderNumber() method, a
# customer by its customerId field.
[augment.receiver]
"com.hafnium.examples.agent.**" = "@"
"com.thirdparty.Order" = "getOrderNumber()"
"com.thirdparty.Customer" = "customerId"

# Parameter ids: "@" uses the methods' @StackTraceParam and @StackTraceParams annotations. OrderService.process
# shows its order argument and its second parameter (quantity), the methods of the Inventory* classes their sku
# and count parameters, and ClassWithoutAnnotation.method its q parameter.
[augment.params]
"com.hafnium.examples.agent.**.*" = "@"
"com.thirdparty.OrderService.process" = ["order", 1]
"com.thirdparty.Inventory*.*" = ["sku", "count"]
"com.hafnium.examples.agent.ClassWithoutAnnotation.method" = ["q"]
