# Instrument every class in these packages; classes without an id use toString() or the identity hash.
include=com.hafnium.**

# Where ids go, see the README. These are the defaults:
#frameFormat={class}{receiver}.{method}{params}
#receiverFormat=[{name}={id}]
#paramsFormat=[{name}={id}, ...]

# A class you cannot annotate: use its getInvoiceNumber() method as the id ...
id.com.thirdparty.Invoice=getInvoiceNumber()
id.com.thirdparty.InvoicePrinter=printerId
# ... and show the invoice argument of InvoicePrinter.print.
param.com.thirdparty.InvoicePrinter.print=invoice
