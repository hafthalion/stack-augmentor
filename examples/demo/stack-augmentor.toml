# Instrument every class in these packages; classes without an id use toString() or the identity hash.
include = ["com.hafnium.**"]

# Where ids go, see the README. These are the defaults:
#frameFormat = "{class}{receiver}.{method}{params}"
#receiverFormat = "[{name}={id}]"
#paramsFormat = "[{name}={id}, ...]"

# Classes you cannot annotate: the invoice is identified by its getInvoiceNumber() method,
# the printer by its printerId field ...
[id]
"com.thirdparty.Invoice" = "getInvoiceNumber()"
"com.thirdparty.InvoicePrinter" = "printerId"

# ... and InvoicePrinter.print shows its invoice argument.
[param]
"com.thirdparty.InvoicePrinter.print" = ["invoice"]
