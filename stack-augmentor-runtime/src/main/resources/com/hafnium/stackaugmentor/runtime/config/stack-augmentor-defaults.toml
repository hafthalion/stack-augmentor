# The built-in configuration: it applies to the agent, the build plugin and the runtime of classes instrumented at build
# time, alone when no configuration file is given, otherwise after the files: their entries come first in each table, and
# their settings win. All keys are listed with the values that also apply where the files leave them out;
# inPlaceModification only as a comment, as setting it asks for a warning where it is not possible.

# Print diagnostics to stderr.
debug = false
# Write augmented frames into the exception's own stack trace instead of a copy; needs java.lang open (the agent
# opens it; with build-time instrumentation, start with --add-opens java.base/java.lang=ALL-UNNAMED), otherwise frames
# are copied.
# inPlaceModification = true

# How frames look.
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$value, ...}"
paramsFormat = "{$name=$value, ...}"
# Longer values are cut off with "…".
maxValueLength = 64

# All exceptions, not errors, are augmented.
[augment.exceptions]
"java.lang.Exception+" = true

# The annotations are read in all classes: those with @Augmented show their @AugmentedReceiver members and
# @AugmentedParam(s) parameter values. Classes without @Augmented are ignored.
[augment.annotations]
"**" = true

# No receiver members or parameter values by name.
[augment.receiver]

[augment.params]
