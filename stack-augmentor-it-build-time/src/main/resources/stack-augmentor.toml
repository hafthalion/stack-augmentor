# One file for both phases:
# - [augment.receiver] and [augment.params] are read at build time by the ByteBuddy build plugin (see
#   build.gradle.kts), which instruments the classes and methods they need;
# - [augment], [augment.exceptions], [augment.receiver], debug and inPlaceModification are read at runtime, from the classpath
#   (or from -Dstackaugmentor.config=<file>).

# Print diagnostics to stderr (default: false).
debug = false

# How frames look, at runtime (these are the defaults, see the README).
[augment]
frameFormat = "$class$receiver.$method$params"
receiverFormat = "{$name=$id, ...}"
paramsFormat = "{$name=$id, ...}"
# Longer ids are cut off with "…".
maxIdLength = 64

# Which exceptions get ids, at runtime: all throwables (without an entry that is true, none would).
[augment.exceptions]
"**" = true

# Only this project's classes are changed. The classes in com.hafnium.it.buildtime.configured have no
# annotations: their ids come from the entries below.
# Keys are "<class>::<methods>": a class name matches that class only, "+" after it ("com.acme.Order+::*") its
# subclasses too, and a pattern matches class names. The methods are names or patterns separated by commas, "*" for
# all, "@" for those annotated with @StackTraceAugment. '*' matches within a package or name, '**' across packages,
# '?' one character.

# Receiver ids: "@" uses the class's @StackTraceId (without an "@" entry, it is not used). Classes you
# cannot annotate name a method() or a field: an order is identified by its getOrderNumber() method, a
# customer by its customerId field. The first matching entry wins, so they come before the "@" pattern.
[augment.receiver]
"com.hafnium.it.buildtime.configured.Order::*" = "getOrderNumber()"
"com.hafnium.it.buildtime.configured.Customer::*" = "customerId"
"com.hafnium.it.buildtime.**::*" = "@"

# Parameter ids, independently of the receivers: "@" uses the methods' @StackTraceParam and @StackTraceParams
# annotations. Otherwise parameters are selected by name or 0-based index, separated by commas, "#" after one shows its value
# hashed, and "-" selects none. When several entries match a method, the first one applies, so the more
# specific entries come first.
[augment.params]
"com.hafnium.it.buildtime.ClassWithoutAnnotation::method" = "q"                # before the "@" pattern
"com.hafnium.it.buildtime.configured.OrderService::process" = "order, 1"       # by name and by index
"com.hafnium.it.buildtime.configured.InventoryAudit::*" = "-"                    # InventoryAudit's first: no parameter ids ...
"com.hafnium.it.buildtime.configured.Inventory*::*" = "sku, count"           # ... then all methods of the other Inventory* classes
"com.hafnium.it.buildtime.configured.Customer::notify" = "email#"              # hashed
"com.hafnium.it.buildtime.configured.Shipment::<init>" = "orderId, weight"   # constructors: "<init>"
"com.hafnium.it.buildtime.configured.Crate::<init>" = "orderId, weight"
"com.hafnium.it.buildtime.**::*" = "@"                                            # the rest: their annotations
